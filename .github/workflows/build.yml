name: Build Kick Chat Tool EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --windowed --name KickChatTool kick_tool.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: KickChatTool-Windows
          path: dist/KickChatTool.exe
